services:
  lugo_studio:
    image: studio
    command:
      - run
    environment:
#      - DEBUG=true
      - STUDIO_LANGUAGE=pt # or en
    #      - DISABLE_TELEMETRY=true # PLEASE! PLEASE! Please do not turn off the telemetry! IT will help us to improve the tool
    ports:
      - "${LUGO_STUDIO_UI_PORT:-3000}:${LUGO_STUDIO_UI_PORT:-3000}" # UI - Change it only if you encounter port limitations. It hasn’t been thoroughly tested and may fail.
      - "${LUGO_STUDIO_API_PORT:-8081}:${LUGO_STUDIO_API_PORT:-8081}" # API - Change it only if you encounter port limitations. It hasn’t been thoroughly tested and may fail.
      - "${LUGO_STUDIO_GAME_FRONTEND_PORT:-8080}:${LUGO_STUDIO_GAME_FRONTEND_PORT:-8080}" # Game frontend - Change it only if you encounter port limitations. It hasn’t been thoroughly tested and may fail.
      - "${LUGO_STUDIO_GAME_SERVER_PORT:-5000}:${LUGO_STUDIO_GAME_SERVER_PORT:-5000}" # Game server (optional, used for advanced debugging) - Change it only if you encounter port limitations. It hasn’t been thoroughly tested and may fail.
    volumes:
      - ${PROJECT_PATH:-./}:/home/coder/project
      - shared-data:/app/logs
  lugo_vscode:
    image: lugo-vs-go
    ports:
      - "${LUGO_VS_CODE_PORT:-8082}:${LUGO_VS_CODE_PORT:-8082}" # Game frontend
    environment:
      - PORT=${LUGO_VS_CODE_PORT:-8082}
    volumes:
      - ${PROJECT_PATH:-./}:/home/coder/project
      - shared-data:/app/logs

volumes:
  shared-data:
